name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build-packages:
    name: Build Packages (Wheel & Sdist)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build sdist and wheel
        run: python -m build

      - name: Validate distribution metadata
        run: twine check --strict dist/*

      - name: Upload distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/*

  build-binaries:
    name: Build Binary (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: f2m-windows-x64
            ext: .exe
          - os: ubuntu-latest
            artifact: f2m-linux-x64
            ext: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies and PyInstaller
        run: |
          pip install -e .
          pip install pyinstaller

      - name: Build standalone binary
        run: pyinstaller --onefile --clean --name f2m f2m.py

      - name: Rename artifact
        shell: bash
        run: mv dist/f2m${{ matrix.ext }} "${{ matrix.artifact }}${{ matrix.ext }}"

      - name: Upload standalone binary
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}${{ matrix.ext }}

  publish-release:
    name: Publish GitHub Release
    needs: [build-packages, build-binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Generate SHA-256 Checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
          generate_release_notes: true
